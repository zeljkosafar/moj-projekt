name: Izgradi AL projekt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Postavi PowerShell
      shell: pwsh
      run: |
        $PSVersionTable.PSVersion
    
    - name: Provjeri AL datoteke
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -Filter "*.al" | ForEach-Object { Write-Host $_.FullName }
    
    - name: Validiraj app.json
      shell: pwsh
      run: |
        if (Test-Path "app.json") {
          Write-Host "app.json pronađen"
          Get-Content app.json
        } else {
          Write-Host "app.json nije pronađen"
          exit 1
        }
