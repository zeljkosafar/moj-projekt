name: Izgradi AL projekt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Postavi PowerShell
      shell: pwsh
      run: |
        $PSVersionTable.PSVersion
    
    - name: Provjeri AL datoteke
      shell: pwsh
      run: |
        Get-ChildItem -Recurse -Filter "*.al" | ForEach-Object { Write-Host $_.FullName }
    
    - name: Validiraj app.json datoteke
      shell: pwsh
      run: |
        $appFiles = Get-ChildItem -Path . -Recurse -Filter "app.json" -File | Where-Object {
          $_.FullName -notmatch '[\\/](\.git|\.alpackages|\.vscode)[\\/]'
        }

        if (-not $appFiles) {
          Write-Host "Nije pronađen nijedan app.json"
          exit 1
        }

        foreach ($appFile in $appFiles) {
          Get-Content -Raw $appFile.FullName | ConvertFrom-Json | Out-Null
          Write-Host "Valjan app.json: $($appFile.FullName)"
        }
